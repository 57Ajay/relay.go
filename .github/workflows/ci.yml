name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall
      - name: Validate Kubernetes manifests
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          kubectl kustomize deploy/kubernetes | kubeconform -strict -summary -kubernetes-version 1.33.1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start Kafka and PostgreSQL
        run: docker compose up -d --wait kafka postgres
      - name: Run integration tests
        run: go test -race -count=1 -tags integration -timeout 5m ./tests/integration/...
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs kafka postgres

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
