name: relay

x-relay: &relay
  image: relay:dev
  build: .
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
    postgres: { condition: service_healthy }

x-relay-env: &relay-env
  KAFKA_BROKERS: kafka:9092
  DATABASE_URL: postgres://relay:relay@postgres:5432/relay?sslmode=disable
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_LEVEL: info

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
    ports: ["9094:9094"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      PARTITIONS: ${KAFKA_PARTITIONS:-6}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in events events.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions "$$PARTITIONS" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic events

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *relay
    environment:
      <<: *relay-env
      SERVICE_NAME: relay-api
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "probe", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  consumer:
    <<: *relay
    entrypoint: ["/usr/local/bin/consumer"]
    environment:
      <<: *relay-env
      SERVICE_NAME: relay-consumer
      WORKERS: ${CONSUMER_WORKERS:-4}
      FAULT_RATE: ${FAULT_RATE:-0}
    deploy:
      replicas: ${CONSUMER_REPLICAS:-2}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/consumer", "probe", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports: ["16686:16686", "4318:4318"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning.yaml:/etc/grafana/provisioning/datasources/relay.yaml:ro
      - ./monitoring/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/relay.yaml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  kafka-data:
  pg-data:
